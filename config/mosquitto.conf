# Mosquitto Configuration for OPM Stats System
# MQTT 3.1.1 broker for game server telemetry

# Listener - plain MQTT on port 1883
listener 1883
protocol mqtt

# WebSocket listener (optional, for web dashboard)
listener 9001
protocol websockets

# Allow anonymous connections (game servers authenticate via topic ACLs)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Message limits
message_size_limit 1048576
max_inflight_messages 100
max_queued_messages 10000

# Keepalive
max_keepalive 120
